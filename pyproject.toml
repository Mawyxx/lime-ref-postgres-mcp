[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lime-ref-postgres-mcp"
version = "2.0.2"
description = "LIME reference MCP door to PostgreSQL — agent passport identity first"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LIME" }]
dependencies = [
    "pglast>=7.0",
    "lime-mcp-server-sdk>=1.0.4,<2",
    "asyncpg>=0.31.0",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyyaml>=6.0",
    "bandit>=1.8",
    "vulture>=2.14",
    "pip-audit>=2.7",
    "testcontainers[postgres]>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lime_ref_postgres_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/README.md",
    "/README.ru.md",
    "/PRD.md",
    "/TDD.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
packages = ["lime_ref_postgres_mcp"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker/Testcontainers and a live PostgreSQL container",
    "e2e: loopback Streamable HTTP smoke (fakes; no live JWKS/Postgres)",
]
addopts = [
    "--strict-markers",
    "-m",
    "not integration and not e2e",
    "--cov=lime_ref_postgres_mcp",
    "--cov-branch",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["lime_ref_postgres_mcp"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .*:",
    "\\.\\.\\.",
    "assert_never",
]
