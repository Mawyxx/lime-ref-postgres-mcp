project_tier: PRIME
adoption_mode: greenfield
stack: python
runtime_scope:
  - src/lime_ref_postgres_mcp/**
tests_scope:
  - tests/**
critical_scope:
  - src/lime_ref_postgres_mcp/domain/**
  - src/lime_ref_postgres_mcp/application/**
exclude_coverage: []
zero_tolerance: true
agent_evidence_required: true
coverage:
  line: 100.0
  branch: 100.0
  diff_only_on_pr: false
  ratchet: true
forbidden_patterns:
  - "pragma: no cover"
  - "assert True"
safety_profile: false
docker_files: []
architecture:
  core_scope:
    - src/lime_ref_postgres_mcp/domain/**
  application_scope:
    - src/lime_ref_postgres_mcp/application/**
  presentation_scope:
    - src/lime_ref_postgres_mcp/presentation/**
  infrastructure_markers:
    - src/lime_ref_postgres_mcp/infrastructure/**
    - src/lime_ref_postgres_mcp/subscribers/**
  composition_root:
    - src/lime_ref_postgres_mcp/bootstrap/**
  testable_core_scope:
    - src/lime_ref_postgres_mcp/domain/**
    - src/lime_ref_postgres_mcp/application/**
  banned_imports_in_core:
    python:
      - mcp
      - asyncpg
      - httpx
      - pglast
      - uvicorn
      - fastapi
      - sqlalchemy
      - pydantic
      - pydantic_settings
      - redis
      - celery
      - srcN
      - lime_mcp_server
      - jwt
      - cryptography
  handler_max_logic_lines: 15
  cyclomatic_max: 10
  file_max_lines: 300
ci:
  workflow_path: .github/workflows/prime_check.yml
  expected_run: "uv run python -m scripts.prime_check"
skipped_steps:
  gitleaks-history:
    adr: ADR-002
    flip_phase: extract-own-repo
  ssrf-gate:
    adr: ADR-002
    flip_phase: N/A-showcase
  pytest-property:
    adr: ADR-002
    flip_phase: P2
  flaky-detector:
    adr: ADR-002
    flip_phase: P2
  idempotency-matrix-gate:
    adr: ADR-002
    flip_phase: when-mutating-uc
  fsm-transition-gate:
    adr: ADR-002
    flip_phase: when-fsm
  migration-path-only:
    adr: ADR-002
    flip_phase: when-migrations
  schema-drift:
    adr: ADR-002
    flip_phase: when-migrations
  api-contract-drift:
    adr: ADR-002
    flip_phase: when-api-contract
  snapshot-contract:
    adr: ADR-002
    flip_phase: when-api-contract
  docker-security:
    adr: ADR-002
    flip_phase: when-docker
  compose-security:
    adr: ADR-002
    flip_phase: when-compose
  health-gate:
    adr: ADR-002
    flip_phase: when-probes
  tls-min-version:
    adr: ADR-002
    flip_phase: when-tls
  cert-forbidden-gate:
    adr: ADR-002
    flip_phase: safety_profile
  concurrency-race-gate:
    adr: ADR-002
    flip_phase: safety_profile
  clang-tidy:
    adr: ADR-002
    flip_phase: safety_profile
  frontend-quality:
    adr: ADR-002
    flip_phase: N/A
  mutation-critical:
    adr: ADR-002
    flip_phase: CRITICAL
